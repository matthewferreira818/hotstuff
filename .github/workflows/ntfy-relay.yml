name: Ntfy relay

# The Cloudflare worker cannot push to ntfy.sh directly (ntfy rate-limits per
# source address unless the account has a paid tier, and workers share egress
# addresses with the whole internet — permanent 429s). GitHub runners' pushes
# deliver reliably, so the worker hands messages here via repository_dispatch
# and this workflow does the actual send.
#
# PRIVACY: this is a public repo, so its run logs are public. The payload can
# contain a lead's name and contact info — it must NEVER be echoed. Values
# only flow through env vars into a silent curl; do not add any step that
# prints the payload.

on:
  repository_dispatch:
    types: [ntfy-relay]

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    timeout-minutes: 5
    steps:
      - name: Send the push
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TITLE: ${{ github.event.client_payload.title }}
          TAGS: ${{ github.event.client_payload.tags }}
          PRIORITY: ${{ github.event.client_payload.priority }}
          BODY: ${{ github.event.client_payload.body }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC secret not set"; exit 1; fi
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://ntfy.sh/${NTFY_TOPIC}" \
              -H "Title: ${TITLE:-HotsTuff}" \
              -H "Tags: ${TAGS:-bell}" \
              -H "Priority: ${PRIORITY:-default}" \
              --data-raw "${BODY:-'(empty)'}")
            if [ "${code:0:1}" = "2" ]; then echo "delivered (attempt $i)"; exit 0; fi
            echo "attempt $i: HTTP $code"
            sleep 5
          done
          echo "all attempts failed"
          exit 1
      # Backup (2026-10-24, his iPhone never buzzed for ntfy): mention him in issue 24 so the GitHub app buzzes.
      # PUBLIC: fixed wording only, chosen from the title. Never the body, which holds a lead's name and contact.
      - name: Backup ping through the GitHub app
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.client_payload.title }}
        run: |
          case "$TITLE" in
            *LEAD*) NOTE="New ECS lead: reply today. The details are on your leads page." ;;
            "ORDER PAID"*) NOTE="Order paid: it needs fulfillment. The details are on your orders page." ;;
            "Order paid"*) NOTE="Order paid and auto-placed with CJ. Nothing to do." ;;
            *) NOTE="A store alert came in. The details are in ntfy." ;;
          esac
          printf '@matthewferreira818 %s\n' "$NOTE" > note.md
          gh issue comment 24 --repo "$GITHUB_REPOSITORY" --body-file note.md && echo "GitHub backup ping posted"
