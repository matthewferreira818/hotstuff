name: Daily TikTok packs (product + agent)

on:
  schedule:
    # NOTE (2026-08-31): GitHub's scheduler has been running this repo's
    # crons ~3-4 hours late, every day since 08-27 -- not skipping them, as
    # first assumed. Evidence: on 08-30 the 10:20/10:50/11:10 fires actually
    # landed at 14:52/15:03/15:19 UTC. The whole chain is therefore shifted
    # ~4 hours earlier so a late fire still lands in Matthew's morning, and
    # off round minutes, which is when the scheduler is most contended.
    - cron: "23 6 * * *"   # 06:23 UTC — packs ready before the morning brief
    # Backup fires. GitHub's scheduler skips or delays runs often enough that
    # the primary alone is not reliable — on 2026-08-27 this workflow, the ECS
    # daily card AND the TikTok draft push all silently failed to fire, so the
    # day produced no packs, no card and no drafts until a manual dispatch.
    # Both backups land before the 11:30 draft push. Re-running is harmless:
    # make_daily_packs.py is deterministic per date, so a second run produces
    # identical files and the commit step's diff check makes it a no-op.
    - cron: "47 7 * * *"
    - cron: "11 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate today's packs
        run: |
          pip install --quiet requests pillow segno
          # ffmpeg is preinstalled on ubuntu-latest runners
          python make_daily_packs.py
          python make_tiktok_video.py

      - name: Commit and push if anything changed
        run: |
          git add marketing/tiktok/daily
          if ! git diff --cached --quiet; then
            git config user.name "wavelist-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Daily TikTok packs (product + agent)"
            git fetch origin master
            git rebase -X theirs origin/master
            git push origin HEAD:master
          else
            echo "No changes"
          fi
