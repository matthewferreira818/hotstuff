name: Change watcher

# Silent unless something newsworthy changed: a buy click, the first tagged
# visit from a channel, a completed checkout, a traffic spike, or a stale
# catalog. Failures are someone else's job (watchdog = uptime, smoke test =
# features) — this watches for GOOD news and for the one quiet failure mode
# nothing else catches (rotation silently stopped).
#
# State between runs lives in actions/cache; a lost cache means one silent
# re-seed, never replayed alerts.

on:
  schedule:
    - cron: "43 */2 * * *"
  workflow_dispatch:
    inputs:
      quiet:
        description: "Log alerts but don't push to the phone (test run)"
        type: boolean
        default: false

concurrency:
  group: watch-changes
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history: the stale-catalog check
          filter: blob:none       # greps commit messages; blobs not needed

      - name: Restore last run's state
        uses: actions/cache/restore@v4
        with:
          path: watch-state.json
          key: watch-state-${{ github.run_id }}
          restore-keys: |
            watch-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Watch for changes
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          QUIET: ${{ inputs.quiet && '1' || '' }}
        run: python watch_changes.py

      - name: Save state for the next run
        uses: actions/cache/save@v4
        if: always()
        with:
          path: watch-state.json
          key: watch-state-${{ github.run_id }}
