name: Meeting Room ping

# When Claude or GPT posts a message addressed to Matthew in the Meeting Room thread (issue 15), send a short push
# to his phone. This is how a "ping" reaches him.
# The thread is locked to people with write access, and only comments from the owner's own account are acted on.
# The message text goes in through an environment variable, never pasted into the shell. Messages are public by
# rule (no keys, no private details), and the ntfy topic is a secret that GitHub masks in logs.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  ping:
    if: ${{ github.event.issue.number == 15 && github.event.comment.user.login == 'matthewferreira818' && contains(github.event.comment.body, '→ Matthew]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Ping Matthew's phone
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BODY: ${{ github.event.comment.body }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC not set; no ping sent"; exit 0; fi
          MSG=$(printf '%s' "$BODY" | head -n 1 | cut -c1-230)
          # Code word (Matthew, 2026-10-24): a message to him containing URGENT goes out at top priority.
          PRIO=default; TITLE="Meeting Room: a message for you"; TAGS=speech_balloon
          if printf '%s' "$BODY" | grep -q 'URGENT'; then PRIO=urgent; TITLE="URGENT: Meeting Room needs you"; TAGS=rotating_light; fi
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "https://ntfy.sh/${NTFY_TOPIC}" \
            -H "Title: ${TITLE}" \
            -H "Priority: ${PRIO}" \
            -H "Tags: ${TAGS}" \
            -H "Click: https://github.com/matthewferreira818/hotstuff/issues/15" \
            -d "$MSG" || true); echo "ntfy answered HTTP ${code:-none}"

  # Every other new room message (Matthew, 2026-10-24: "can we add it to ntfy as well?"; 10-25: "only certain ntfy notifs give me
  # notification"): priority min, so it sits silently in the ntfy app with no buzz or sound. Pings to him, URGENT, leads and orders still buzz. A
  # push so he knows the room moved, even with the Mac closed. Skips his own posts and the ones already pinged above.
  room-update:
    if: ${{ github.event.issue.number == 15 && github.event.comment.user.login == 'matthewferreira818' && !contains(github.event.comment.body, '→ Matthew]') && !startsWith(github.event.comment.body, '**[Matthew') }}
    runs-on: ubuntu-latest
    steps:
      - name: Quiet room update
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BODY: ${{ github.event.comment.body }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC not set; no push sent"; exit 0; fi
          MSG=$(printf '%s' "$BODY" | head -n 1 | cut -c1-160)
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "https://ntfy.sh/${NTFY_TOPIC}" \
            -H "Title: Meeting Room update" \
            -H "Priority: min" \
            -H "Tags: memo" \
            -H "Click: https://github.com/matthewferreira818/hotstuff/issues/15" \
            -d "$MSG" || true); echo "ntfy answered HTTP ${code:-none}"
