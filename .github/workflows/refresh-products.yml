name: Refresh trending products

on:
  schedule:
    # every 3 days at 09:00 UTC (fires on days 1,4,7,...,28,31 of each month;
    # the month boundary makes one interval shorter than 3 days — close enough)
    - cron: "0 9 */3 * *"
    # backup crons: GitHub's scheduler sometimes skips or delays the 09:00
    # fire by hours. These retries self-heal a missed refresh; the gate step
    # below makes whichever fires first win and the rest no-op.
    - cron: "30 10 */3 * *"
    - cron: "0 13 */3 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-products
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Skip if the catalog already refreshed today (backup-cron guard)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && git log --since=midnight --oneline | grep -q "Refresh: trending products"; then
            echo "Catalog already refreshed today — this is a duplicate scheduled fire. Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'

        with:
          python-version: "3.12"

      - name: Run refresh script
        if: steps.gate.outputs.run == 'true'
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
        run: python refresh_products.py

      - name: Generate fresh social posts
        if: steps.gate.outputs.run == 'true'
        run: python generate_posts.py

      - name: Generate TikTok photo pack
        if: steps.gate.outputs.run == 'true'
        run: |
          pip install --quiet requests pillow segno
          python make_tiktok_pack.py

      - name: Regenerate Pinterest pin pack from the fresh rotation
        if: steps.gate.outputs.run == 'true'
        run: python make_pinterest_pins.py

      - name: Commit and push if anything changed
        id: commit
        if: steps.gate.outputs.run == 'true'
        run: |
          git add products.json rotation-history.json marketing/latest-posts.md marketing/tiktok marketing/pinterest
          if ! git diff --cached --quiet; then
            git config user.name "wavelist-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Refresh: trending products + social posts (3-day cycle)"
            # runner-queue delays can start this job long after checkout's SHA
            # was pinned; rebase onto the live head so an interim push to master
            # doesn't get ours rejected as non-fast-forward
            git fetch origin master
            git rebase -X theirs origin/master
            git push origin HEAD:master
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tweet the fresh drop (skips until X API secrets are configured)
        if: steps.gate.outputs.run == 'true' && steps.commit.outputs.changed == 'true'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          pip install --quiet requests requests-oauthlib pillow segno
          python post_refresh_tweet.py 2>&1 | tee tweet.log

      - name: Credit watch — alert if X credits are depleted
        if: steps.gate.outputs.run == 'true' && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q "X_CREDITS_DEPLETED" tweet.log; then
            if ! gh issue list --state open --search "X credits depleted" --json number --jq length | grep -qv '^0$'; then
              gh issue create \
                --title "🔴 X credits depleted — tweets are paused" \
                --body "The fresh-drops roundup tweet failed with HTTP 402 (credits depleted). Top up at https://console.x.com (Buy Credits) and tweets resume automatically on the next run. No other store systems are affected."
            else
              echo "Depletion issue already open — not duplicating."
            fi
          else
            echo "Credits OK."
          fi
