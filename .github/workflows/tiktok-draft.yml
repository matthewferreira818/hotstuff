name: TikTok draft push

# Pushes today's slide packs into the store's TikTok account as DRAFTS via
# the Content Posting API (MEDIA_UPLOAD mode). They land as inbox
# notifications; Matthew opens each in the app, adds a sound, and taps Post.
# Runs after the daily pack generates (~10:52 UTC). Skips silently until
# the TIKTOK_* secrets are configured.
#
# This used to run on a single cron. The reasoning was that a duplicate fire
# would push duplicate drafts (TikTok caps pending drafts at 5 and doesn't
# dedupe content), so a missed morning would be recovered by hand.
#
# That assumed GitHub's scheduler is reliable. It isn't: 11:30 was skipped or
# hours late on 08-27, 08-29 and 08-30, and each miss needed a manual dispatch.
#
# 08-31 follow-up: the run history says these were never actually skipped --
# they fired 3-4 hours behind schedule, after the morning brief had already
# dispatched by hand. The guard below is what stopped those late fires from
# double-posting: on 08-30 it no-opped runs 28 and 29 in ~10 seconds each.
# Times are now set ~4 hours early so a lagging fire still lands in the
# morning.
# So: backup crons, plus a guard that asks the Actions API whether a run of
# this workflow already succeeded today and no-ops if one did. That gets the
# recovery without the duplicate-draft risk the single cron was protecting.
#
# A run that fails the freshness gate is NOT a success, so a later backup will
# retry it — by then daily-tiktok's own backup crons have usually rebuilt the
# packs, which is exactly the recovery we want.

on:
  schedule:
    - cron: "37 7 * * *"    # after daily-tiktok's first pack build
    - cron: "13 9 * * *"    # backup, after daily-tiktok's own late crons
    - cron: "41 10 * * *"   # last chance before the morning brief reads this
  workflow_dispatch:
    inputs:
      pack:
        description: "Which pack to push"
        type: choice
        options: [both, product, agent]
        default: both

permissions:
  contents: read
  actions: read      # the duplicate guard reads this workflow's own run history

concurrency:
  group: tiktok-draft
  cancel-in-progress: false

jobs:
  push-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skip if today's drafts already went out (backup-cron guard)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only scheduled fires are guarded — a manual dispatch is always a
          # deliberate "push it now" and must never be silently swallowed.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          DONE=$(gh run list --workflow tiktok-draft.yml --status success \
                   --created "$(date -u +%F)" --json databaseId --jq 'length' || echo 0)
          if [ "${DONE:-0}" -gt 0 ]; then
            echo "Drafts already pushed today ($DONE successful run(s)) — no-op."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse to push stale packs (freshness gate)
        if: steps.gate.outputs.run == 'true'
        run: |
          # The packs are regenerated each morning; if generation was skipped,
          # this file still describes YESTERDAY. Pushing it would put stale —
          # possibly already-posted — slides in the inbox, which is worse than
          # sending nothing. Fail loudly instead so the miss is visible.
          STAMP=$(grep -o '_Generated [0-9-]*' marketing/tiktok/daily/captions.md | awk '{print $2}')
          TODAY=$(date -u +%F)
          echo "packs generated: ${STAMP:-none} · today: $TODAY"
          if [ "$STAMP" != "$TODAY" ]; then
            echo "::error::Packs are stale (${STAMP:-missing}); refusing to push yesterday's slides. Run daily-tiktok.yml, then re-run this."
            exit 1
          fi

      - name: Push today's packs as TikTok drafts
        if: steps.gate.outputs.run == 'true'
        env:
          TIKTOK_PACK: ${{ github.event.inputs.pack || 'both' }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python tiktok_engine.py post
