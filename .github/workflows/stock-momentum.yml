name: Stock bot (momentum)

# Robot 2: the momentum strategy on its own practice account, next to the
# dip robot (stock-bot.yml). One run loops through the trading day: every
# 10 seconds it guards what it holds (mid-day stop-loss), and in the last
# ~25 minutes it makes the day's buy decisions, like the backtest. Same
# hourly queue trick as the dip robot to cover the 6-hour job limit.
# Public logs: the script prints counts only.

on:
  schedule:
    - cron: "7 13-20 * * 1-5"
  workflow_dispatch:
    inputs:
      now:
        description: "Run one close check right now (testing)"
        type: boolean
        default: false

concurrency:
  group: stock-momentum-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test
        run: |
          python stock_bot/momentum_bot.py --selftest
          python stock_bot/paper_broker.py --selftest
      - name: Run
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOW: ${{ inputs.now && '--now' || '' }}
        run: python stock_bot/momentum_bot.py $NOW
