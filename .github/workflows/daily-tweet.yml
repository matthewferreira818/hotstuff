name: Product spotlight 3x daily (X + Instagram)

on:
  schedule:
    - cron: "0 13 * * *"   # morning slot  (~10am Atlantic)
    - cron: "0 17 * * *"   # afternoon slot (~2pm Atlantic)
    - cron: "0 21 * * *"   # evening slot  (~6pm Atlantic)
    # backup crons: GitHub's scheduler sometimes skips or delays a fire by
    # hours (the 13:00 slot was silently dropped on 2026-08-05). One retry
    # per slot, still inside the same slot window (<15h / <19h / >=19h UTC,
    # matching current_slot() in post_daily_tweet.py); the gate step below
    # makes whichever fires first win and the rest no-op.
    - cron: "30 14 * * *"  # morning backup
    - cron: "30 18 * * *"  # afternoon backup
    - cron: "30 22 * * *"  # evening backup
  workflow_dispatch:
    inputs:
      offset:
        description: "Shift the product pick (test runs use 1 to avoid duplicates)"
        required: false
        default: "0"

permissions:
  contents: read
  issues: write
  actions: read   # the gate lists today's runs to dedupe backup-cron fires

jobs:
  pause:
    uses: ./.github/workflows/pause-gate.yml

  spotlight:
    needs: pause
    if: needs.pause.outputs.paused != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Gate — skip duplicate slot fires and refresh-day mornings
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HOUR=$((10#$(date -u +%H)))
          # slot windows must match current_slot() in post_daily_tweet.py
          if [ "$HOUR" -lt 15 ]; then LO=0; HI=14
          elif [ "$HOUR" -lt 19 ]; then LO=15; HI=18
          else LO=19; HI=23; fi

          POST=true
          # refresh days: the fresh-drops roundup covers the morning slot
          if [ "$HOUR" -lt 15 ] && git log --since=midnight --oneline | grep -q "Refresh: trending products"; then
            echo "Catalog refreshed today — the fresh-drops roundup covers the morning slot. Skipping."
            POST=false
          fi
          # backup-cron dedupe: if a scheduled run already succeeded inside
          # this slot's window today, this fire is a duplicate — skip it
          if [ "$POST" = true ] && [ "${{ github.event_name }}" = "schedule" ]; then
            # id:startedAt pairs, so we can check whether the run actually
            # posted. A run halted by the PAUSE switch concludes "success"
            # with its spotlight job skipped; counting it would mean deleting
            # PAUSE still costs the rest of the day's slots.
            for pair in $(gh run list --workflow daily-tweet.yml --event schedule --status success \
                          --created "$(date -u +%Y-%m-%d)" --json databaseId,startedAt \
                          --jq '.[] | "\(.databaseId):\(.startedAt)"'); do
              id=${pair%%:*}; ts=${pair#*:}
              C=$(gh run view "$id" --json jobs \
                    --jq '.jobs[] | select(.name=="spotlight") | .conclusion' || echo "")
              [ "$C" = "success" ] || continue
              H=$((10#$(date -u -d "$ts" +%H)))
              if [ "$H" -ge "$LO" ] && [ "$H" -le "$HI" ]; then
                echo "Slot already covered by the successful run started at $ts — skipping duplicate fire."
                POST=false
                break
              fi
            done
          fi
          echo "post=$POST" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.post == 'true'
        with:
          python-version: "3.12"

      - name: Post this slot's spotlight (ad card + QR reply)
        if: steps.gate.outputs.post == 'true'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          SPOTLIGHT_OFFSET: ${{ inputs.offset }}
        run: |
          pip install --quiet requests requests-oauthlib pillow segno
          python post_daily_tweet.py 2>&1 | tee tweet.log

      - name: Post today's Instagram photo (afternoon slot only; skips until IG secrets are configured)
        if: steps.gate.outputs.post == 'true' && (github.event.schedule == '0 17 * * *' || github.event.schedule == '30 18 * * *' || github.event_name == 'workflow_dispatch')
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python post_daily_instagram.py

      - name: Credit watch — alert if X credits are depleted
        if: steps.gate.outputs.post == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q "X_CREDITS_DEPLETED" tweet.log; then
            if ! gh issue list --state open --search "X credits depleted" --json number --jq length | grep -qv '^0$'; then
              gh issue create \
                --title "🔴 X credits depleted — daily tweets are paused" \
                --body "A spotlight tweet failed with HTTP 402 (credits depleted). Top up at https://console.x.com (Buy Credits) and tweets resume automatically on the next run. Note: the bot now posts 3 spotlights + 3 QR replies a day (~180 posts/mo), so credits go ~6x faster than the old 1-a-day setup. No other store systems are affected."
            else
              echo "Depletion issue already open — not duplicating."
            fi
          else
            echo "Credits OK."
          fi
