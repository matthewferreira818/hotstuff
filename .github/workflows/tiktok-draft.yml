name: TikTok draft push

# Pushes today's slide packs into the store's TikTok account as DRAFTS via
# the Content Posting API (MEDIA_UPLOAD mode). They land as inbox
# notifications; Matthew opens each in the app, adds a sound, and taps Post.
# Runs after the daily pack generates (~10:52 UTC). Skips silently until
# the TIKTOK_* secrets are configured.
#
# This used to run on a single cron. The reasoning was that a duplicate fire
# would push duplicate drafts (TikTok caps pending drafts at 5 and doesn't
# dedupe content), so a missed morning would be recovered by hand. That
# assumed GitHub's scheduler is reliable, and it is not.
#
# What actually happens (checked against the run history on 08-31): the fires
# are not skipped, they arrive 3-4 hours late -- after the morning brief has
# already looked and dispatched by hand. So the workflow needs two things a
# single cron can't give it:
#
#   1. A guard, so a late fire arriving after a manual push no-ops instead of
#      dropping duplicate drafts in the inbox. On 08-30 it caught exactly that
#      twice, in about ten seconds each.
#   2. A trigger that doesn't depend on guessing when the packs will be ready.
#      Both workflows carry the same variable lag, so no fixed cron offset is
#      safe -- see the workflow_run note below.
#
# A run that fails the freshness gate is NOT a success, so a later fire will
# retry it, by which time the packs have usually been rebuilt. That is exactly
# the recovery we want.

on:
  # The real trigger: fire as soon as the pack build actually finishes.
  # Cron ordering can't work here -- both workflows are subject to the same
  # (variable) scheduler lag, so a draft push scheduled an hour after the pack
  # build can still start before it. On 09-01 the packs didn't land until
  # 11:44 UTC, by which time all three of this workflow's crons had already
  # come and gone. Chaining off completion removes the guesswork; the crons
  # below stay as a safety net for the day the chain itself misfires.
  workflow_run:
    workflows: ["Daily TikTok packs (product + agent)"]
    types: [completed]
    branches: [master]
  schedule:
    - cron: "37 7 * * *"    # after daily-tiktok's first pack build
    - cron: "13 9 * * *"    # backup, after daily-tiktok's own late crons
    - cron: "41 10 * * *"   # last chance before the morning brief reads this
  workflow_dispatch:
    inputs:
      pack:
        description: "Which pack to push"
        type: choice
        options: [both, product, agent]
        default: both
      media:
        description: "Rendered video, or fall back to the slides carousel"
        type: choice
        options: [video, photo]
        default: video

permissions:
  contents: read
  actions: read      # the duplicate guard reads this workflow's own run history

concurrency:
  group: tiktok-draft
  cancel-in-progress: false

jobs:
  push-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skip if today's drafts already went out (backup-cron guard)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only a manual dispatch skips the guard — it is always a deliberate
          # "push it now". Scheduled and pack-build-chained fires are both
          # guarded, so whichever gets there first wins and the rest no-op.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          DONE=$(gh run list --workflow tiktok-draft.yml --status success \
                   --created "$(date -u +%F)" --json databaseId --jq 'length' || echo 0)
          if [ "${DONE:-0}" -gt 0 ]; then
            echo "Drafts already pushed today ($DONE successful run(s)) — no-op."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse to push stale packs (freshness gate)
        if: steps.gate.outputs.run == 'true'
        run: |
          # The packs are regenerated each morning; if generation was skipped,
          # this file still describes YESTERDAY. Pushing it would put stale —
          # possibly already-posted — slides in the inbox, which is worse than
          # sending nothing. Fail loudly instead so the miss is visible.
          STAMP=$(grep -o '_Generated [0-9-]*' marketing/tiktok/daily/captions.md | awk '{print $2}')
          TODAY=$(date -u +%F)
          echo "packs generated: ${STAMP:-none} · today: $TODAY"
          if [ "$STAMP" != "$TODAY" ]; then
            echo "::error::Packs are stale (${STAMP:-missing}); refusing to push yesterday's slides. Run daily-tiktok.yml, then re-run this."
            exit 1
          fi

      - name: Push today's packs as TikTok drafts
        if: steps.gate.outputs.run == 'true'
        env:
          TIKTOK_PACK: ${{ github.event.inputs.pack || 'both' }}
          TIKTOK_MEDIA: ${{ github.event.inputs.media || 'video' }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python tiktok_engine.py post
