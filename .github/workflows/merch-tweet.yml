name: One-off merch showcase tweet

# Manual only. This USED to fire on any push touching its own path, on the
# reasoning that nobody would ever edit the file again. That assumption broke
# on 2026-09-05: wiring the PAUSE gate into every publishing workflow touched
# this one, and it posted a duplicate merch tweet to @FindHotsTuff at 05:32
# UTC before anyone could stop it (the first went out 2026-08-13).
#
# A self-triggering workflow that publishes in public is a trap: the very act
# of maintaining it makes it post. Dispatch it by hand when you actually want
# a merch tweet.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pause:
    uses: ./.github/workflows/pause-gate.yml

  tweet:
    needs: pause
    if: needs.pause.outputs.paused != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post the merch showcase tweet (ad card + QR reply)
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          pip install --quiet requests requests-oauthlib pillow segno
          python post_merch_tweet.py

      - name: Record the result in the repo
        run: |
          git config user.name "hotstuff-bot"
          git config user.email "actions@users.noreply.github.com"
          git add marketing/merch-tweet-result.txt
          git diff --cached --quiet || git commit -m "Record merch tweet result"
          git push
