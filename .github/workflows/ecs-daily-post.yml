name: ECS daily post

on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC = 9:00 AM Atlantic — morning-coffee slot
  workflow_dispatch:
    inputs:
      only_x:
        description: "Skip Facebook, post only to X (for testing the X hookup)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ecs-daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests requests_oauthlib
      - name: Generate today's card + caption
        run: python marketing/east-coast-social/engine/generate_ecs_post.py
      - name: Publish today's materials to the repo (for manual posting sessions)
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add -f marketing/east-coast-social/engine/out automation/feed
          if ! git diff --cached --quiet; then
            git commit -m "ECS daily card + caption ($(date -u +%F))"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
      - name: Publish to Facebook Page
        if: ${{ github.event.inputs.only_x != 'true' }}
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python marketing/east-coast-social/engine/post_to_facebook.py
      - name: Publish to X (East Coast Social account)
        env:
          ECS_X_API_KEY: ${{ secrets.ECS_X_API_KEY }}
          ECS_X_API_SECRET: ${{ secrets.ECS_X_API_SECRET }}
          ECS_X_ACCESS_TOKEN: ${{ secrets.ECS_X_ACCESS_TOKEN }}
          ECS_X_ACCESS_TOKEN_SECRET: ${{ secrets.ECS_X_ACCESS_TOKEN_SECRET }}
        run: python marketing/east-coast-social/engine/post_to_x.py
