<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Connected — HotsTuff Engine</title>
<meta name="robots" content="noindex">
<style>
  body { margin: 0; background: #191016; color: #f6edf3; min-height: 100vh;
         display: flex; align-items: center; justify-content: center;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; padding: 40px 24px; text-align: center; }
  h1 { font-size: 26px; margin: 0 0 12px; }
  p { color: #b59fab; font-size: 15px; line-height: 1.6; }
  code { display: block; background: #251a22; border: 1px solid rgba(246,237,243,.14);
         border-radius: 12px; padding: 16px; margin: 20px 0; font-size: 14px;
         word-break: break-all; color: #f59e0b; }
  button { background: #f59e0b; color: #191016; border: 0; border-radius: 10px;
           padding: 12px 22px; font-size: 15px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>✅ TikTok authorization received</h1>
  <p id="msg">Copy the code below and paste it back into the setup session —
  it's the one-time key that finishes connecting the engine to the TikTok
  account.</p>
  <code id="code">…</code>
  <button id="copy">Copy code</button>
</main>
<script>
  // OAuth redirect target for the HotsTuff Engine TikTok app. The code in the
  // URL is single-use and short-lived; this page just makes it easy to copy.
  var params = new URLSearchParams(location.search);
  var code = params.get("code");
  var err = params.get("error") || params.get("error_description");
  var box = document.getElementById("code");
  if (code) {
    box.textContent = code;
  } else if (err) {
    document.querySelector("h1").textContent = "❌ Authorization failed";
    document.getElementById("msg").textContent =
      "TikTok sent back an error instead of a code:";
    box.textContent = err;
  } else {
    document.querySelector("h1").textContent = "Nothing here yet";
    document.getElementById("msg").textContent =
      "This page only does something at the end of the TikTok connect flow.";
    box.textContent = "no code in URL";
  }
  document.getElementById("copy").addEventListener("click", function () {
    navigator.clipboard.writeText(box.textContent).then(function () {
      this.textContent = "Copied ✓";
    }.bind(this));
  });
</script>
</body>
</html>
