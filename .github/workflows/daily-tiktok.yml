name: Daily TikTok packs (product + agent)

on:
  schedule:
    # NOTE (2026-08-31): GitHub's scheduler has been running this repo's
    # crons ~3-4 hours late, every day since 08-27 -- not skipping them, as
    # first assumed. Evidence: on 08-30 the 10:20/10:50/11:10 fires actually
    # landed at 14:52/15:03/15:19 UTC. The whole chain is therefore shifted
    # ~4 hours earlier so a late fire still lands in Matthew's morning, and
    # off round minutes, which is when the scheduler is most contended.
    - cron: "23 6 * * *"   # 06:23 UTC — packs ready before the morning brief
    # Backup fires. GitHub's scheduler skips or delays runs often enough that
    # the primary alone is not reliable — on 2026-08-27 this workflow, the ECS
    # daily card AND the TikTok draft push all silently failed to fire, so the
    # day produced no packs, no card and no drafts until a manual dispatch.
    # Both backups land before the 11:30 draft push. Re-running is harmless:
    # make_daily_packs.py is deterministic per date, so a second run produces
    # identical files and the commit step's diff check makes it a no-op.
    - cron: "47 7 * * *"
    - cron: "11 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pause:
    uses: ./.github/workflows/pause-gate.yml

  packs:
    needs: pause
    if: needs.pause.outputs.paused != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20   # the date checks below need file history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Backup crons exist because the scheduler is unreliable, but this
      # workflow had no "already done" guard, so on a normal day all three
      # fires did the full build. The slides are deterministic per date and
      # diff away to nothing -- but ffmpeg output is NOT byte-reproducible,
      # so each backup re-rendered both videos and committed ~1.2 MB of
      # churn producing identical-looking files. On 2026-09-06 that was
      # three commits and ~2.4 MB of pure waste, and it happens every day.
      #
      # The condition is exactly what tiktok-draft.yml's freshness gate
      # needs: today's captions AND both videos dated today. If the video
      # step failed earlier (it is allowed to), this still runs and retries.
      - name: Skip if today's packs are already complete (backup-cron guard)
        id: gate
        run: |
          RUN=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TODAY=$(date -u +%F)
            STAMP=$(grep -o '_Generated [0-9-]*' marketing/tiktok/daily/captions.md | awk '{print $2}')
            if [ "$STAMP" = "$TODAY" ]; then
              RUN=false
              for f in marketing/tiktok/daily/product/pack.mp4 marketing/tiktok/daily/agent/pack.mp4; do
                VID=$(git log -1 --format=%cs -- "$f")
                if [ ! -f "$f" ] || [ "$VID" != "$TODAY" ]; then
                  echo "$f is ${VID:-missing}, not today -- rebuilding to retry the render."
                  RUN=true
                fi
              done
            fi
          fi
          [ "$RUN" = false ] && echo "Today's packs are already complete -- duplicate scheduled fire, skipping."
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - name: Generate today's packs
        if: steps.gate.outputs.run == 'true'
        run: |
          # imageio-ffmpeg carries its own ffmpeg binary. The runner does NOT
          # have one - assuming it did failed the whole job on 09-04 and, worse,
          # took the slide commit down with it.
          pip install --quiet requests pillow segno imageio-ffmpeg
          python make_daily_packs.py

      # Deliberately its own step, and deliberately allowed to fail. The slides
      # are the product; the video is an enhancement on top of them. A broken
      # renderer must never again stop the packs being committed.
      - name: Render the video packs (optional - slides ship regardless)
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python make_tiktok_video.py

      - name: Commit and push if anything changed
        if: steps.gate.outputs.run == 'true'
        run: |
          git add marketing/tiktok/daily
          if ! git diff --cached --quiet; then
            git config user.name "wavelist-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Daily TikTok packs (product + agent)"
            git fetch origin master
            git rebase -X theirs origin/master
            git push origin HEAD:master
          else
            echo "No changes"
          fi
